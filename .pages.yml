- name: services
  label: DBA Services
  type: group
  items:
  - name: services-en
    label: English Services
    type: collection
    path: src/content/services/english
    exclude:
    - -index.md
    format: yaml-frontmatter
    filename: '{primary}.mdx'
    view:
      primary: title
      fields:
      - title
      - description
      - draft
    fields: &id002
    - name: title
      label: Service Name
      type: string
      required: true
    - name: customSlug
      label: Custom URL Slug
      type: string
    - name: description
      label: Short Description
      type: text
    - name: date
      label: Date
      type: date
    - name: icon
      label: Icon or SVG Path
      type: string
    - name: image
      label: Service Image
      type: image
    - name: draft
      type: boolean
    - name: metaTitle
      label: SEO Title
      type: string
    - name: metaDescription
      label: SEO Description
      type: text
    - name: body
      label: Service Content (MDX)
      type: code
      options:
        format: mdx
    operations:
      rename: false
      delete: false
  - name: services-fr
    label: French Services
    type: collection
    path: src/content/services/french
    exclude:
    - -index.md
    format: yaml-frontmatter
    filename: '{primary}.mdx'
    view:
      primary: title
      fields:
      - title
      - description
      - draft
    fields: *id002
    operations:
      rename: false
      delete: false
  - name: services-index-en
    label: English Services Page Settings
    type: file
    path: src/content/services/english/-index.md
    format: code
    options:
      language: yaml
    operations:
      delete: false
  - name: services-index-fr
    label: French Services Page Settings
    type: file
    path: src/content/services/french/-index.md
    format: code
    options:
      language: yaml
    operations:
      delete: false
settings:
  content:
    merge: true
  commit:
    templates:
      create: 'content: create {path}'
      update: 'content: update {path}'
      delete: 'content: delete {path}'
      rename: 'content: rename {oldPath} to {newPath}'
